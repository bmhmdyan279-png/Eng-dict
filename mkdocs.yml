site_name: فرهنگ واژگان تخصصی مهندسی
site_description: دیکشنری تخصصی مهندسی با معادل‌های چندزبانه (FA/EN/FR/DE/AR)
site_url: https://bmhmdyan279-png.github.io/eng-terms-fa/
repo_url: https://github.com/bmhmdyan279-png/eng-terms-fa
repo_name: eng-terms-fa

theme:
  name: material
  language: fa
  direction: rtl
  font:
    text: Vazirmatn
    code: Fira Code
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: تغییر به حالت شب
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: تغییر به حالت روز
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - navigation.instant
    - navigation.tracking

plugins:
  - search
  - mike

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/math.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bmhmdyan279-png/eng-terms-fa
  alternate:
    - name: فارسی
      link: /
      lang: fa

nav:
  - 🏠 خانه: index.md
  - 📖 فهرست واژگان: terms/index.md
  - 📱 بارکد کتاب: qr.md
  - ✍️ مشارکت: contribute.md
  - 📄 درباره: about.md
  - 📝 استناد: citation.md
  - 📨 فرم مشارکت غیرفنی: contribute-form.md