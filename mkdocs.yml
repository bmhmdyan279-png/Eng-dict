site_name: فرهنگ واژه‌های تخصصی مهندسی
site_description: فرهنگ لغت آنلاین و چندزبانهٔ واژه‌های فنی و مهندسی
site_url: https://bmhmdyan279-png.github.io/Eng-dict/
repo_url: https://github.com/bmhmdyan279-png/Eng-dict
repo_name: bmhmdyan279-png/Eng-dict
site_dir: site

theme:
  name: material
  language: fa
  direction: rtl
  font:
    text: Vazirmatn
    code: Fira Code
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - content.tabs.link
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: تاریک شود
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: روشن شود
  icon:
    repo: fontawesome/brands/github
  logo: assets/icon.svg
  favicon: assets/icon.svg

plugins:
  - search:
      lang: [fa, en]
  - offline:
      enabled: true

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bmhmdyan279-png/Eng-dict

extra_css:
  - assets/css/extra.css

extra_javascript:
  - { path: "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js", defer: true }
  - { path: "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js", defer: true }
  - { path: assets/js/math.js, defer: true }
  - { path: assets/js/pagefind.js, type: module }

nav:
  - خانه: index.md
  - واژه‌ها:
    - الفبایی: terms/index.md
    - دسته‌بندی: terms/categories.md
  - مشارکت: contribute.md
  - درباره: about.md
  - ارجاع: citation.md
