[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "concrete-dict"
version = "1.0.0"
description = "فرهنگ آنلاین واژه‌های تخصصی بتن"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mkdocs-material>=9.5,<10",
    "pyyaml>=6.0,<7",
]

[project.license]
text = "MIT"
