name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Pagefind locally
        run: npm install pagefind

      - name: Generate Markdown pages
        run: python scripts/build_pages.py

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Build site with mike (v1, no push)
        run: mike deploy --update-aliases v1 latest --deploy-prefix .

      - name: Copy PWA manifest
        run: |
          if [ -f docs/manifest.webmanifest ]; then
            cp docs/manifest.webmanifest site/
            echo "✅ PWA manifest copied"
          else
            echo "⚠️ PWA manifest not found, skipping"
          fi

      - name: Build Pagefind index
        run: npx pagefind --site site --output-subdir pagefind

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deploy